<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Internship Application | Digital Literacy</title>

<link rel="stylesheet" href="css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>


<body>


<!-- NAVBAR -->


<header class="header">

    <div class="logo">

        

        <h2>Digital Literacy</h2>

    </div>


    <nav>

        <button onclick="window.location.href='index.html'">Home</button>

        <button onclick="window.location.href='learn.html'">Learn</button>

        <button onclick="window.location.href='quiz.html'">Quiz</button>

        <button onclick="window.location.href='career.html'">Career</button>

        <button onclick="window.location.href='index.html#about'">About</button>

        <button onclick="window.location.href='index.html#contact'">Contact</button>

        <button onclick="window.location.href='login.html'">Login</button>

    </nav>

</header>



<!-- APPLICATION SECTION -->


<section class="application-section">


<div class="application-container">


<div class="application-heading">

<h1>Internship Application Form 🚀</h1>

<p>
Join our Digital Literacy project and gain real-world experience while building your career.
</p>

</div>



<form class="internship-form" id="internshipForm">


<div class="form-group">

<label>Full Name</label>

<input type="text" name="fullName" placeholder="Enter your name" required>

</div>



<div class="form-group">

<label>Email Address</label>

<input type="email" name="email" placeholder="Enter your email" required>

</div>



<div class="form-group">

<label>Mobile Number</label>

<input type="tel" name="mobileNumber" placeholder="Enter mobile number" required>

</div>



<div class="form-group">

<label>College Name</label>

<input type="text" name="collegeName" placeholder="Enter college name" required>

</div>



<div class="form-group">

<label>Select Internship Domain</label>

<select name="domain" required>

<option value="">Choose Domain</option>

<option>Web Development</option>

<option>Data Analytics</option>

<option>UI / UX Design</option>

<option>Android Development</option>

<option>AI & Machine Learning</option>

<option>Digital Marketing</option>

</select>

</div>



<div class="form-group">

<label>Your Skills</label>

<textarea name="skills" placeholder="Example: HTML, CSS, Python, SQL"></textarea>

</div>



<div class="form-group">

<label>Upload Resume</label>

<input type="file" name="resume">

</div>



<button class="submit-application">

Submit Application

</button>



</form>


</div>


</section>




<footer class="footer">

<div class="footer-content">

<h3>Digital Literacy for Senior Citizens</h3>

<p>
Empowering Senior Citizens through Technology Education.
</p>

<p>
© 2026 All Rights Reserved.
</p>

</div>

</footer>



<script src="js/script.js"></script>
<script src="js/internship.js"></script>


</body>

</html>
